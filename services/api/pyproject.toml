[project]
name = "micromarket-api"
version = "0.1.0"
description = "FastAPI service for micromarket ingestion, sentiment, forecasting, and evaluation"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "starlette>=0.41,<0.42",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "anyio>=3.7,<4",
  "httpx>=0.27,<0.28",
  "yfinance>=0.2",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
